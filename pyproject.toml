[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gfn1-rs-python"
version = "0.4.5"
description = "Python and ASE interface for the native Rust GFN1-RS implementation"
requires-python = ">=3.9,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "ss0832" }]
readme = "README.md"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
ase = ["ase>=3.22", "numpy>=1.22"]
test = ["pytest>=8", "ase>=3.22", "numpy>=1.22"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "gfn1_rs._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
